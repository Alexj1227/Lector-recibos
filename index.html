<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador Inteligente de Recibos y Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; font-size: 22px; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 20px; background: #f8f9fa; padding: 15px; border-left: 4px solid #1a73e8; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; }
        .loading { color: #e37400; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lector Inteligente de Recibos</h1>
    <p>Sube la imagen de tu recibo, factura o ticket para extraer la fecha, montos y texto organizado automáticamente.</p>
    
    <div class="form-group">
        <label for="apiKey">Clave de API de Google AI Studio:</label>
        <input type="password" id="apiKey" placeholder="Pega tu API Key de Gemini aquí">
    </div>

    <div class="form-group">
        <label for="receiptFile">Seleccionar Recibo (Imagen):</label>
        <input type="file" id="receiptFile" accept="image/*">
    </div>

    <button onclick="processReceipt()">Procesar Recibo con IA</button>

    <div id="result"></div>
</div>

<script>
async function processReceipt() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('receiptFile').files[0];
    const resultDiv = document.getElementById('result');

    if (!apiKey) {
        alert('Por favor, ingresa tu API Key de Google AI Studio.');
        return;
    }
    if (!fileInput) {
        alert('Por favor, selecciona una imagen de recibo.');
        return;
    }

    resultDiv.innerHTML = '<span class="loading">Procesando imagen y extrayendo datos con Gemini...</span>';

    try {
        const base64Data = await toBase64(fileInput);
        
        const promptText = "Analiza este recibo o factura. Extrae y organiza la información estrictamente en el siguiente formato:\n- Fecha del comprobante:\n- Proveedor / Establecimiento:\n- Texto completo extraído:\n- Montos y Totales detectados:\nMantenlo limpio y ordenado cronológicamente.";

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: promptText },
                        {
                            inline_data: {
                                mime_type: fileInput.type,
                                data: base64Data
                            }
                        }
                    ]
                }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content) {
            const output = data.candidates[0].content.parts[0].text;
            resultDiv.innerText = output;
        } else {
            resultDiv.innerText = 'Error al procesar la respuesta: ' + JSON.stringify(data);
        }

    } catch (error) {
        resultDiv.innerText = 'Ocurrió un error en la ejecución: ' + error.message;
    }
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
