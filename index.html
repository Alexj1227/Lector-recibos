<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador Inteligente de Recibos y Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; font-size: 22px; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 20px; background: #f8f9fa; padding: 15px; border-left: 4px solid #1a73e8; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; }
        .loading { color: #e37400; font-weight: bold; }
        
        /* Estilo específico para el botón de copiar */
        #btnCopiar {
            background-color: #28a745;
            margin-top: 10px;
            padding: 8px 15px;
            font-size: 14px;
            display: none; /* Se oculta inicialmente hasta que haya resultados */
            width: auto;
        }
        #btnCopiar:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lector Inteligente de Recibos</h1>
    <p>Sube la imagen de tu recibo, factura o ticket para extraer la fecha, montos y texto organizado automáticamente.</p>

    <div class="form-group">
        <label for="receiptFile">Seleccionar Recibo (Imagen):</label>
        <input type="file" id="receiptFile" accept="image/*">
    </div>

    <button onclick="processReceipt()">Procesar Recibo con IA</button>

    <div id="result"></div>
    
    <!-- Botón de Copiar Resultados -->
    <button id="btnCopiar" onclick="copiarTextoResultado()">📋 Copiar Resultados</button>
</div>

<script>
async function processReceipt() {
    const fileInput = document.getElementById('receiptFile').files[0];
    const resultDiv = document.getElementById('result');
    const btnCopiar = document.getElementById('btnCopiar');

    // Ocultar el botón mientras procesa una nueva imagen
    btnCopiar.style.display = 'none';

    if (!fileInput) {
        alert('Por favor, selecciona una imagen de recibo.');
        return;
    }

    resultDiv.innerHTML = '<span class="loading">Procesando imagen y extrayendo datos con Gemini...</span>';

    try {
        const base64Data = await toBase64(fileInput);
        
        // Llamada a una función serverless o backend seguro de Vercel
        const response = await fetch('/api/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                image: base64Data,
                mimeType: fileInput.type
            })
        });

        const data = await response.json();
        
        if (data.result) {
            resultDiv.innerText = data.result;
            // Mostrar el botón de copiar una vez que el resultado es exitoso
            btnCopiar.style.display = 'block';
        } else {
            resultDiv.innerText = 'Error al procesar: ' + (data.error || 'Respuesta desconocida');
        }

    } catch (error) {
        resultDiv.innerText = 'Ocurrió un error en la ejecución: ' + error.message;
    }
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });
}

function copiarTextoResultado() {
    const elementoResultado = document.getElementById("result");
    const textoARecuperar = elementoResultado.innerText;

    if (!textoARecuperar.trim()) {
        alert("No hay texto para copiar.");
        return;
    }

    navigator.clipboard.writeText(textoARecuperar).then(() => {
        const boton = document.getElementById("btnCopiar");
        const textoOriginal = boton.innerText;
        
        boton.innerText = "¡Copiado con éxito! ✅";
        boton.style.backgroundColor = "#137333";
        
        setTimeout(() => {
            boton.innerText = textoOriginal;
            boton.style.backgroundColor = "#28a745";
        }, 2000);
    }).catch(err => {
        console.error("Error al copiar: ", err);
        alert("No se pudo copiar automáticamente.");
    });
}
</script>

</body>
</html>
